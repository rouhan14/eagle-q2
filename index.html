<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Transcript Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .summary-container {
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }
        .summary-box {
            background-color: #edf7ff;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 0 4px 4px 0;
        }
        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meeting Transcript Summarizer</h1>
        
        <form method="POST" id="transcript-form">
            <div>
                <label for="transcript"><b>Paste your meeting transcript below:</b></label>
                <textarea id="transcript" name="transcript" placeholder="Paste meeting transcript here..." required></textarea>
            </div>
            
            <button type="submit">Generate 3-Sentence Summary</button>
            
            <div class="loading" id="loading">
                <p>Generating summary... This may take a few moments.</p>
            </div>
        </form>
        
        {% if summary %}
        <div class="summary-container">
            <h2>Summary</h2>
            <div class="summary-box">
                <p>{{ summary }}</p>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        document.getElementById('transcript-form').addEventListener('submit', function() {
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</body>
</html>
